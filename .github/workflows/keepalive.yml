# Render's free tier sleeps a service after 15 idle minutes, and the next visit
# waits ~1 minute for a cold start. A visit every 5 minutes keeps it awake.
#
# Runs 24/7. Free instance hours (750/month) are shared by every free
# service in the workspace, so a second always-on service can run out near
# month end. Narrow the cron hours if that happens.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null https://mothaf.onrender.com/ar
